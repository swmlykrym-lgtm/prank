<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Security Alert</title>

<style>
body {
  background:#050505;
  color:#00ff66;
  font-family:Arial;
  text-align:center;
  padding-top:15vh;
}

h1 {
  color:#ff2222;
  font-size:38px;
}

#progress {
  font-size:22px;
  margin:25px;
}

#files {
  color:#ff5555;
  font-size:20px;
}

#joke {
  display:none;
  color:white;
  font-size:30px;
}
</style>
</head>

<body>

<h1>⚠️ تم اختراق جهازك ⚠️</h1>

<div id="progress">جاري الاتصال بالنظام...</div>
<div id="files"></div>

<div id="joke">
😂😂 مــقــلــب 😂😂<br><br>
ولا انحذف أي شيء من جهازك ❤️
</div>

<script>
let messages = [
"جاري الوصول إلى الملفات...",
"جاري فحص الصور...",
"جاري فحص أرقام الهاتف...",
"جاري حذف جميع الملفات...",
"جاري حذف جميع الصور...",
"جاري حذف جهات الاتصال..."
];

let i = 0;

let timer = setInterval(() => {
  document.getElementById("files").innerText = messages[i];
  i++;

  if (i >= messages.length) {
    clearInterval(timer);

    setTimeout(() => {
      document.getElementById("files").style.display = "none";
      document.getElementById("progress").style.display = "none";
      document.querySelector("h1").style.display = "none";
      document.getElementById("joke").style.display = "block";
    }, 2000);
  }
}, 1200);
</script>

</body>
</html>
